<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121010" media="(prefers-color-scheme: dark)">
<meta name="description" content="ソルフェジオ周波数の各音をタップで再生／停止。複数同時に鳴らせます。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ソルフェジオ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<title>ソルフェジオ周波数</title>
<style>
  html{color-scheme:light dark;-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}

  :root{
    --bg:#f4f1ea;
    --panel:#fbf9f4;
    --ink:#26221c;
    --muted:#7c7264;
    --line:rgba(38,34,28,.14);
    --radius:16px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#121010;
      --panel:#1b1917;
      --ink:#ece5d8;
      --muted:#8b8175;
      --line:rgba(236,229,216,.15);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121010;
    --panel:#1b1917;
    --ink:#ece5d8;
    --muted:#8b8175;
    --line:rgba(236,229,216,.15);
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }

  .wrap{
    max-width:460px;margin:0 auto;
    min-height:100dvh;
    padding:clamp(22px,5vh,40px) 18px 30px;
    display:flex;flex-direction:column;gap:20px;
  }

  header{display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
  h1{
    margin:0;
    font-family:"Fraunces",Georgia,serif;
    font-weight:500;
    font-size:clamp(27px,7.5vw,33px);
    letter-spacing:.01em;
  }
  .sub{font-size:14px;color:var(--muted);line-height:1.65;max-width:32ch}

  .vol{
    display:flex;align-items:center;gap:12px;width:100%;
    background:var(--panel);border:1.5px solid var(--line);
    border-radius:var(--radius);padding:12px 16px;
  }
  .vol .ic{color:var(--muted);font-size:16px;flex:none}
  .vol input[type="range"]{
    flex:1;height:26px;accent-color:var(--ink);
    background:transparent;cursor:pointer;
  }

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad{
    position:relative;
    appearance:none;
    border:1.5px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    border-radius:var(--radius);
    aspect-ratio:1/1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    cursor:pointer;font-family:inherit;
    touch-action:manipulation;
    overflow:hidden;
    transition:border-color .25s, box-shadow .3s, transform .06s;
  }
  .pad::before{
    content:"";position:absolute;inset:0;
    background:var(--hue);opacity:0;
    transition:opacity .3s;pointer-events:none;
  }
  .pad:active{transform:scale(.97)}
  .pad > *{position:relative;z-index:1}
  .hz{
    font-family:"Fraunces",Georgia,serif;
    font-size:clamp(23px,6.6vw,29px);
    font-weight:500;line-height:1;
    transition:color .25s;
  }
  .hz .unit{font-size:.5em;margin-left:2px;color:var(--muted)}
  .mean{font-size:12.5px;color:var(--muted);letter-spacing:.02em;text-align:center;padding:0 4px}
  .ind{
    width:22px;height:3px;border-radius:2px;background:var(--line);
    transition:background .3s;
  }

  .pad[aria-pressed="true"]{
    border-color:var(--hue);
    box-shadow:0 0 0 1px var(--hue), 0 8px 30px -8px var(--hue);
  }
  .pad[aria-pressed="true"]::before{opacity:.13}
  .pad[aria-pressed="true"] .hz{color:var(--hue)}
  .pad[aria-pressed="true"] .hz .unit{color:var(--hue)}
  .pad[aria-pressed="true"] .ind{
    background:var(--hue);
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.35;transform:scaleX(.55)}
    50%{opacity:1;transform:scaleX(1)}
  }
  @media (prefers-reduced-motion:reduce){
    .pad[aria-pressed="true"] .ind{animation:none;opacity:.9}
  }

  .pad:focus-visible,.stopall:focus-visible,.vol input:focus-visible{
    outline:2px solid var(--ink);outline-offset:3px;
  }

  .stopall{
    appearance:none;
    border:1.5px solid var(--line);
    background:transparent;color:var(--muted);
    border-radius:var(--radius);
    padding:15px;font-family:inherit;font-weight:700;font-size:15px;
    width:100%;cursor:pointer;touch-action:manipulation;
    transition:opacity .2s, border-color .2s, color .2s;
  }
  .stopall:disabled{opacity:.4;cursor:default}
  .stopall:not(:disabled){border-color:var(--ink);color:var(--ink)}

  .hint{
    margin:0;font-size:11px;line-height:1.7;color:var(--muted);
    text-align:center;text-wrap:balance;
  }

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>ソルフェジオ周波数</h1>
    <p class="sub">ボタンをタップで再生、もう一度で停止。複数を同時に鳴らせます。</p>
  </header>

  <div class="vol">
    <span class="ic" aria-hidden="true">🔉</span>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5" aria-label="音量">
    <span class="ic" aria-hidden="true">🔊</span>
  </div>

  <div class="grid" id="grid"></div>

  <button class="stopall" id="stopAll" disabled>すべて停止</button>

  <p class="hint">
    低い周波数はスマホのスピーカーでは鳴りにくいため、イヤホンの使用をおすすめします。<br>
    再生中は画面が消えないようにします（画面ロックすると音は止まります）。<br>
    ※ 周波数の健康効果は科学的に確認されていません。リラックス用としてお楽しみください。
  </p>
</div>

<p class="sr-only" id="sr" aria-live="polite"></p>

<script>
(function(){
  "use strict";

  var FREQS = [
    {hz:174, mean:"痛みの緩和",   hue:"#d4495b"},
    {hz:285, mean:"組織の回復",   hue:"#e07a3f"},
    {hz:396, mean:"恐れの解放",   hue:"#e0a63f"},
    {hz:417, mean:"変化・好転",   hue:"#b3b23f"},
    {hz:528, mean:"愛・変容",     hue:"#57bd68"},
    {hz:639, mean:"つながり",     hue:"#3fb1ac"},
    {hz:741, mean:"浄化・解決",   hue:"#3f90d1"},
    {hz:852, mean:"直感",         hue:"#6d5bd1"},
    {hz:963, mean:"高次の意識",   hue:"#9b5bd1"}
  ];

  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null;
  var voices = {};            // hz -> {osc, gain}
  var wakeLock = null;
  var VOLKEY = "solfeggio.vol";

  var vol = 0.5;
  try{
    var sv = parseFloat(localStorage.getItem(VOLKEY));
    if(sv >= 0 && sv <= 1) vol = sv;
  }catch(e){}

  var grid = document.getElementById("grid");
  var volEl = document.getElementById("vol");
  var stopAllBtn = document.getElementById("stopAll");
  var srEl = document.getElementById("sr");

  volEl.value = String(vol);

  function ensureCtx(){
    if(!AC) return;
    if(!ctx){
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = vol * 0.8;
      master.connect(ctx.destination);   // コンプレッサーは外した（ポツポツ音の原因になりやすい）
    }
    if(ctx.state === "suspended") ctx.resume();
  }

  function count(){ return Object.keys(voices).length; }

  // 全ての正弦波が最悪同位相で重なっても歪まないよう、声部数で線形に按分
  function perVoiceGain(){
    var n = count() || 1;
    return 1.0 / (n + 0.7);
  }
  // 現在値から目標値へ、音の途切れが出ない直線フェード
  function fadeTo(param, target, dur){
    var now = ctx.currentTime;
    var cur = param.value;
    param.cancelScheduledValues(now);
    param.setValueAtTime(cur, now);
    param.linearRampToValueAtTime(target, now + dur);
  }
  function rebalance(){
    if(!ctx) return;
    var g = perVoiceGain();
    Object.keys(voices).forEach(function(hz){
      fadeTo(voices[hz].gain.gain, g, 0.20);
    });
  }

  function startTone(hz){
    ensureCtx();
    if(!ctx || voices[hz]) return;
    var t = ctx.currentTime + 0.03;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(hz, t);
    g.gain.value = 0;                       // ちょうど0から始める＝開始クリックなし
    osc.connect(g);
    g.connect(master);
    osc.start(t);
    voices[hz] = {osc:osc, gain:g};
    rebalance();
    requestWake();
    updateUI();
    srEl.textContent = hz + "ヘルツ 再生中";
  }
  function stopTone(hz){
    var vc = voices[hz];
    if(!vc || !ctx){ delete voices[hz]; updateUI(); return; }
    var now = ctx.currentTime, rel = 0.22;
    var p = vc.gain.gain;
    p.cancelScheduledValues(now);
    p.setValueAtTime(p.value, now);
    p.linearRampToValueAtTime(0, now + rel);   // ちょうど0まで下げ切る
    try{ vc.osc.stop(now + rel + 0.05); }catch(e){}
    var dead = vc;
    setTimeout(function(){ try{ dead.osc.disconnect(); dead.gain.disconnect(); }catch(e){} }, (rel + 0.3) * 1000);
    delete voices[hz];
    rebalance();
    if(count() === 0) releaseWake();
    updateUI();
    srEl.textContent = hz + "ヘルツ 停止";
  }
  function toggle(hz){
    if(voices[hz]) stopTone(hz); else startTone(hz);
  }
  function stopAll(){
    Object.keys(voices).forEach(function(hz){ stopTone(parseInt(hz, 10)); });
    srEl.textContent = "すべて停止しました";
  }

  function setVol(v){
    vol = v;
    try{ localStorage.setItem(VOLKEY, String(v)); }catch(e){}
    if(master && ctx) fadeTo(master.gain, vol * 0.8, 0.08);
  }

  /* ---- wake lock ---- */
  function requestWake(){
    try{
      if("wakeLock" in navigator && !wakeLock){
        navigator.wakeLock.request("screen").then(function(w){
          wakeLock = w;
          w.addEventListener("release", function(){ wakeLock = null; });
        }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWake(){
    try{ if(wakeLock) wakeLock.release(); }catch(e){}
    wakeLock = null;
  }

  /* ---- UI ---- */
  var pads = [];
  FREQS.forEach(function(f){
    var b = document.createElement("button");
    b.className = "pad";
    b.dataset.hz = String(f.hz);
    b.style.setProperty("--hue", f.hue);
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", f.hz + "ヘルツ " + f.mean);
    b.innerHTML =
      '<span class="hz">' + f.hz + '<span class="unit">Hz</span></span>' +
      '<span class="mean">' + f.mean + '</span>' +
      '<span class="ind" aria-hidden="true"></span>';
    b.addEventListener("click", function(){ toggle(f.hz); });
    grid.appendChild(b);
    pads.push(b);
  });

  function updateUI(){
    pads.forEach(function(p){
      p.setAttribute("aria-pressed", voices[p.dataset.hz] ? "true" : "false");
    });
    stopAllBtn.disabled = count() === 0;
  }

  volEl.addEventListener("input", function(){ setVol(parseFloat(volEl.value)); });
  stopAllBtn.addEventListener("click", stopAll);

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      if(ctx && ctx.state === "suspended") ctx.resume();
      if(count() > 0) requestWake();
    }
  });

  updateUI();
})();
</script>
</body>
</html>
